<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <header class="game-header">
      <h1 class="game-title">Tic-Tac-Toe</h1>
      <div id="status" class="status-display" aria-live="polite">
        Player <span class="player-indicator player-x">X</span>'s Turn
      </div>
    </header>

    <div id="board" class="game-board" role="grid" aria-label="Tic-Tac-Toe Board">
      <button class="cell" data-cell-index="0" aria-label="Row 1 Column 1"></button>
      <button class="cell" data-cell-index="1" aria-label="Row 1 Column 2"></button>
      <button class="cell" data-cell-index="2" aria-label="Row 1 Column 3"></button>
      <button class="cell" data-cell-index="3" aria-label="Row 2 Column 1"></button>
      <button class="cell" data-cell-index="4" aria-label="Row 2 Column 2"></button>
      <button class="cell" data-cell-index="5" aria-label="Row 2 Column 3"></button>
      <button class="cell" data-cell-index="6" aria-label="Row 3 Column 1"></button>
      <button class="cell" data-cell-index="7" aria-label="Row 3 Column 2"></button>
      <button class="cell" data-cell-index="8" aria-label="Row 3 Column 3"></button>
    </div>

    <footer class="game-controls">
      <button id="restart-btn" class="restart-btn" type="button">Restart Game</button>
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
